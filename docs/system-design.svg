<svg xmlns="http://www.w3.org/2000/svg" width="760" height="575" viewBox="0 0 760 575" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Kukkaro system design</title>
<desc>The phone web app calls FastAPI behind Caddy on a Verda V100 instance. The trusted zone runs the coach, deterministic tools and the order planner over DuckDB and synthetic receipts, using Gemma 4 on a Verda serverless container. A privacy gateway checks every outgoing question before the public zone calls Exa and Gemini. Store-brand swaps send only a fixed product search from a static map. Gemini is also the backup model. Product pictures load in the browser from S-kaupat.</desc>
<style>
  .bg{fill:#ffffff}
  .th{font-size:14px;font-weight:600;fill:#2C2C2A}
  .ts{font-size:12px;fill:#5F5E5A}
  .arr{stroke:#73726C;stroke-width:1.4;fill:none}
  .box rect,.box{fill:#ffffff;stroke:#B4B2A9}
  .cont{fill:#F1EFE8;stroke:#B4B2A9}
  .teal{fill:#E1F5EE;stroke:#0F6E56}
  .amber{fill:#FAEEDA;stroke:#854F0B}
  .purple{fill:#EEEDFE;stroke:#534AB7}
  .gray{fill:#F1EFE8;stroke:#888780}
  .t-teal{fill:#04342C}.s-teal{fill:#0F6E56}
  .t-amber{fill:#412402}.s-amber{fill:#854F0B}
  .t-purple{fill:#26215C}.s-purple{fill:#534AB7}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1E1E1C}
    .th{fill:#F1EFE8}.ts{fill:#B4B2A9}
    .arr{stroke:#B4B2A9}
    .box rect,.box{fill:#2C2C2A;stroke:#5F5E5A}
    .cont{fill:#262624;stroke:#5F5E5A}
    .teal{fill:#04342C;stroke:#5DCAA5}
    .amber{fill:#412402;stroke:#EF9F27}
    .purple{fill:#26215C;stroke:#AFA9EC}
    .gray{fill:#2C2C2A;stroke:#888780}
    .t-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}
    .t-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}
    .t-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="575"/>

<!-- Browser -->
<rect class="box" x="270" y="20" width="220" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="380" y="40" text-anchor="middle">Phone browser · React web app</text>
<text class="ts" x="380" y="60" text-anchor="middle">Home · Baskets · Ask Kukkaro · Help</text>

<rect class="gray" x="570" y="20" width="160" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="650" y="40" text-anchor="middle">S-kaupat images</text>
<text class="ts" x="650" y="60" text-anchor="middle">product pictures only</text>
<line x1="492" y1="48" x2="567" y2="48" class="arr" stroke-dasharray="4 4" marker-end="url(#a)"/>

<!-- Instance -->
<rect class="cont" x="30" y="100" width="700" height="262" rx="16" stroke-width="0.8"/>
<text class="th" x="48" y="122">Verda V100 instance (FIN-01) · Caddy HTTPS → uvicorn</text>
<line x1="380" y1="78" x2="380" y2="134" class="arr" marker-end="url(#a)"/>
<rect class="box" x="50" y="136" width="660" height="44" rx="8" stroke-width="0.8"/>
<text class="th" x="380" y="154" text-anchor="middle">FastAPI (also serves the built web app)</text>
<text class="ts" x="380" y="171" text-anchor="middle">/api/chat · /api/butler · /api/customers/{id}/… · /api/transactions/{id}/receipt</text>
<line x1="175" y1="180" x2="175" y2="198" class="arr" marker-end="url(#a)"/>
<line x1="585" y1="180" x2="585" y2="198" class="arr" marker-end="url(#a)"/>

<rect class="teal" x="50" y="200" width="250" height="142" rx="10" stroke-width="0.8"/>
<text class="th t-teal" x="175" y="222" text-anchor="middle">Trusted zone</text>
<text class="ts s-teal" x="175" y="244" text-anchor="middle">Coach + deterministic tools</text>
<text class="ts s-teal" x="175" y="264" text-anchor="middle">Orders: plan · swaps · approve</text>
<text class="ts s-teal" x="175" y="284" text-anchor="middle">DuckDB · S-Bank synthetic data</text>
<text class="ts s-teal" x="175" y="304" text-anchor="middle">Synthetic receipts</text>
<text class="ts s-teal" x="175" y="324" text-anchor="middle">numbers only from code</text>

<rect class="amber" x="315" y="200" width="130" height="90" rx="10" stroke-width="0.8"/>
<text class="th t-amber" x="380" y="222" text-anchor="middle">Privacy gateway</text>
<text class="ts s-amber" x="380" y="246" text-anchor="middle">coach/privacy.py</text>
<text class="ts s-amber" x="380" y="266" text-anchor="middle">only banded text</text>

<rect class="purple" x="460" y="200" width="250" height="142" rx="10" stroke-width="0.8"/>
<text class="th t-purple" x="585" y="222" text-anchor="middle">Public zone</text>
<text class="ts s-purple" x="585" y="244" text-anchor="middle">research.py · facts + sources</text>
<text class="ts s-purple" x="585" y="264" text-anchor="middle">products.py · S-kaupat products</text>
<text class="ts s-purple" x="585" y="284" text-anchor="middle">product cache · server-side prices</text>
<text class="ts s-purple" x="585" y="304" text-anchor="middle">never sees customer data</text>

<line x1="302" y1="245" x2="313" y2="245" class="arr" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="447" y1="245" x2="458" y2="245" class="arr" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="ts" x="380" y="310" text-anchor="middle">swaps: fixed query</text>
<line x1="302" y1="324" x2="458" y2="324" class="arr" stroke-dasharray="4 4" marker-end="url(#a)"/>

<!-- Outside services -->
<rect class="teal" x="50" y="420" width="220" height="60" rx="8" stroke-width="0.8"/>
<text class="th t-teal" x="160" y="444" text-anchor="middle">Gemma 4 · vLLM</text>
<text class="ts s-teal" x="160" y="464" text-anchor="middle">Verda serverless container</text>
<rect class="purple" x="460" y="420" width="120" height="60" rx="8" stroke-width="0.8"/>
<text class="th t-purple" x="520" y="444" text-anchor="middle">Exa API</text>
<text class="ts s-purple" x="520" y="464" text-anchor="middle">search + page text</text>
<rect class="purple" x="590" y="420" width="120" height="60" rx="8" stroke-width="0.8"/>
<text class="th t-purple" x="650" y="444" text-anchor="middle">Gemini API</text>
<text class="ts s-purple" x="650" y="464" text-anchor="middle">facts · backup</text>

<line x1="160" y1="342" x2="160" y2="418" class="arr" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="520" y1="342" x2="520" y2="418" class="arr" marker-end="url(#a)"/>
<line x1="650" y1="342" x2="650" y2="418" class="arr" marker-end="url(#a)"/>
<path d="M280 342 L280 505 L650 505 L650 482" class="arr" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text class="ts" x="465" y="522" text-anchor="middle">backup model only, if Gemma fails</text>

<!-- Legend -->
<rect class="teal" x="50" y="548" width="12" height="12" rx="3" stroke-width="0.8"/>
<text class="ts" x="68" y="558">sees customer data</text>
<rect class="amber" x="200" y="548" width="12" height="12" rx="3" stroke-width="0.8"/>
<text class="ts" x="218" y="558">gateway</text>
<rect class="purple" x="290" y="548" width="12" height="12" rx="3" stroke-width="0.8"/>
<text class="ts" x="308" y="558">never sees customer data</text>
<rect class="gray" x="480" y="548" width="12" height="12" rx="3" stroke-width="0.8"/>
<text class="ts" x="498" y="558">loaded by the browser</text>
</svg>
