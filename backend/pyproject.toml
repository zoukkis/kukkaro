[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kukkaro"
version = "0.1.0"
description = "Kukkaro: an AI money coach for S-mobiili (Junction 2026)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",           # HTTP API (architecture, AGENTS.md §4)
    "uvicorn[standard]>=0.54",  # runs the FastAPI app
    "duckdb>=2.0",              # fast exact queries over the S-Bank Parquet files (DATA)
    "pydantic>=2.14",           # request/response and receipt models
    "python-dotenv>=1.2",       # reads keys and DATA_DIR/DEMO_TODAY from the root .env
    "google-genai>=3.3",        # Gemini, and Gemma 4 stage 1 through the same API (COACH)
    "openai>=3.51",             # OpenAI-compatible client for Gemma on Verda/vLLM (COACH stage 2)
    "exa-py>=2.28",             # Exa search for the Butler (BUTLER)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",              # tests in backend/tests
    "httpx>=0.28",              # FastAPI's TestClient
]

[tool.setuptools.packages.find]
include = ["kukkaro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
